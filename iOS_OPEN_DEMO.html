<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="留学新手村" />
  <title>留学生新手村 Demo</title>
  <style>
    :root{--sage:#b8cdae;--ink:#334237;--muted:#667265;--leaf:#7aa35a;--leaf-dark:#4f7542;--sun:#ffe36d;--shadow:rgba(55,72,59,.18)}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:#9fb79a;font-family:ui-rounded,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
    button{font:inherit}.screen{position:relative;min-height:100vh;overflow:hidden auto;background:radial-gradient(circle at 30% 18%,rgba(255,248,223,.5),transparent 28%),linear-gradient(180deg,#b9cdae 0%,#d9e1bd 52%,#f5df9e 100%)}
    .texture{position:fixed;inset:0;pointer-events:none;opacity:.42;background-image:linear-gradient(rgba(255,255,255,.4) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.36) 1px,transparent 1px),repeating-linear-gradient(12deg,transparent 0 32px,rgba(255,255,255,.13) 33px,transparent 34px);background-size:54px 54px,54px 54px,120px 120px}
    .frame{position:relative;z-index:1;width:min(100%,480px);min-height:100vh;margin:0 auto;padding:22px 18px calc(34px + env(safe-area-inset-bottom));animation:pageIn .42s ease both}
    @keyframes pageIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}.center{display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
    .eyebrow{margin:0;color:rgba(255,255,255,.9);font-size:13px;font-weight:900;text-shadow:0 2px 0 rgba(56,70,58,.23)}.title{margin:4px 0 0;color:#fff;font-size:clamp(34px,12vw,54px);line-height:.96;font-weight:950;text-shadow:0 4px 0 rgba(54,60,52,.42),2px 0 0 rgba(54,60,52,.18),-2px 0 0 rgba(54,60,52,.18)}
    .story{width:100%;max-width:360px;font-size:17px;line-height:1.72;font-weight:700}.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;max-width:340px;min-height:48px;border:0;border-radius:18px;padding:13px 18px;cursor:pointer;font-weight:950;text-decoration:none}.primary{color:#3e4b34;background:var(--sun);box-shadow:0 6px 0 #d2a84b,0 14px 24px var(--shadow)}.secondary{color:#fff;background:var(--leaf);box-shadow:0 6px 0 var(--leaf-dark),0 14px 24px var(--shadow)}.ghost{color:var(--leaf-dark);background:rgba(255,252,239,.65)}
    .cat{position:relative;width:154px;height:186px;animation:bob 2.8s ease-in-out infinite}.cat:before{content:"";position:absolute;right:16px;bottom:42px;width:38px;height:80px;border:10px solid #7f939c;border-left:0;border-radius:0 48px 48px 0}.body{position:absolute;left:28px;top:22px;width:92px;height:142px;border:5px solid #6f7c7d;border-radius:48% 48% 42% 42%;background:repeating-linear-gradient(110deg,transparent 0 9px,rgba(97,122,132,.32) 10px 12px),linear-gradient(115deg,#7f939c 0 33%,#fff7df 34% 71%,#7f939c 72%);box-shadow:0 8px 0 rgba(66,82,75,.22)}
    .ear{position:absolute;top:-24px;width:32px;height:42px;border:5px solid #6f7c7d;background:#8199a2;clip-path:polygon(50% 0,100% 100%,0 100%)}.ear:after{content:"";position:absolute;left:8px;top:12px;width:13px;height:18px;background:#ff9260;clip-path:polygon(50% 0,100% 100%,0 100%)}.ear.l{left:5px;transform:rotate(-22deg)}.ear.r{right:5px;transform:rotate(22deg)}
    .eye{position:absolute;top:30px;width:22px;height:27px;border-radius:50%;background:#fffdf0;border:3px solid #6f7c7d}.eye:after{content:"";position:absolute;right:3px;bottom:4px;width:10px;height:13px;border-radius:50%;background:#54443f}.eye.l{left:18px}.eye.r{right:18px}.nose{position:absolute;left:40px;top:58px;width:10px;height:8px;border-radius:50%;background:#f07165}.belly{position:absolute;left:25px;bottom:15px;width:42px;height:62px;border-radius:50%;background:rgba(255,249,225,.76)}.bag{position:absolute;left:-16px;top:72px;width:30px;height:42px;border:4px solid #5a7448;border-radius:12px;background:#8db568}.case{position:absolute;right:10px;bottom:7px;width:34px;height:44px;border:4px solid #8a684d;border-radius:10px;background:#c79968}@keyframes bob{50%{translate:0 -7px}}
    .top{padding:8px 4px 16px}.sub,.progressText{margin:8px 0 0;color:var(--muted);font-weight:800}.bar{width:100%;height:16px;margin-top:16px;padding:3px;overflow:hidden;border:2px solid rgba(71,92,67,.35);border-radius:999px;background:rgba(255,252,239,.68)}.bar span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#8fb866,#ffe36d)}
    .map{position:relative;min-height:1240px;padding:12px 0 40px}.clouds{height:46px;color:rgba(255,255,255,.82);font-size:30px;text-align:center}.path{position:absolute;left:50%;top:66px;width:18px;height:1110px;transform:translateX(-50%);border-radius:999px;background:repeating-linear-gradient(180deg,rgba(151,104,67,.45) 0 16px,transparent 16px 34px),#ead08b}.nodes{position:relative;z-index:2;display:grid;gap:22px}.node{display:flex;align-items:center;gap:12px;width:78%;min-height:124px;padding:16px;border:3px solid rgba(255,255,255,.66);border-radius:24px;background:rgba(255,252,239,.74);box-shadow:0 8px 0 rgba(72,97,63,.16),0 18px 30px rgba(70,86,68,.12);cursor:pointer}.node:nth-child(odd){justify-self:start}.node:nth-child(even){justify-self:end}.node.locked{opacity:.68;filter:saturate(.7);cursor:default}.node.available,.node.delayed{animation:glow 1.8s ease-in-out infinite}.node.completed{background:rgba(245,238,169,.86)}@keyframes glow{50%{box-shadow:0 8px 0 rgba(72,97,63,.16),0 0 0 7px rgba(255,227,109,.28),0 18px 30px rgba(70,86,68,.16)}}.icon{display:grid;place-items:center;flex:0 0 58px;height:58px;border-radius:50%;background:#d5e5b8;font-size:30px}.copy p,.copy h2{margin:0}.copy p{color:var(--leaf-dark);font-size:12px;font-weight:950}.copy h2{margin-top:5px;font-size:19px;line-height:1.15}.copy span{display:inline-block;margin-top:8px;color:#fff;border-radius:999px;padding:4px 10px;background:var(--leaf);font-size:11px;font-weight:950}
    .panel{margin:18px 0;padding:18px;border:2px solid rgba(92,117,82,.16);border-radius:20px;background:rgba(255,252,239,.72);box-shadow:0 8px 20px rgba(70,86,68,.09)}.panel h2{margin:0 0 9px;font-size:17px}.panel p{margin:0;color:var(--muted);font-size:16px;line-height:1.6;font-weight:700}.big{margin-bottom:10px!important;color:var(--ink)!important;font-size:20px!important;font-weight:950!important}.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}.list li{position:relative;min-height:32px;padding-left:38px;font-size:16px;line-height:1.5;font-weight:800}.list li:before{content:"";position:absolute;left:0;top:0;width:26px;height:26px;border:3px solid #8fb866;border-radius:9px;background:rgba(255,255,255,.45)}
    .art{position:relative;display:grid;place-items:center;width:180px;height:142px;margin:22px auto}.art span{position:relative;z-index:2;font-size:70px;filter:drop-shadow(0 8px 0 rgba(61,71,61,.14))}.art i{position:absolute;inset:34px 4px 18px;border-radius:55% 45% 45% 55%;background:#8eb96b;box-shadow:-42px 14px 0 #6f9c55,42px 12px 0 #a5c66e,2px -20px 0 #ffe66f}.actions{display:grid;width:100%;justify-items:center;gap:14px}.quote,.notice{width:100%;margin:18px 0;padding:18px;border-radius:22px;background:rgba(255,252,239,.74);font-size:17px;line-height:1.7;font-weight:800;white-space:pre-line}.notice{color:var(--leaf-dark);background:rgba(255,248,199,.72)}.badge{display:grid;place-items:center;width:86px;height:86px;border-radius:50%;background:rgba(255,252,239,.76);font-size:44px;box-shadow:0 7px 0 rgba(75,95,70,.14)}
    .photo{display:grid;justify-items:center;gap:14px;width:100%}.photo img,.empty{width:100%;max-width:340px;aspect-ratio:4/3;object-fit:cover;border:8px solid rgba(255,252,239,.86);border-radius:18px;box-shadow:0 13px 28px rgba(68,84,67,.18)}.empty{display:grid;place-items:center;border:3px dashed rgba(79,117,66,.46);background:rgba(255,252,239,.62);color:var(--leaf-dark);font-weight:950}.moods{display:grid;width:100%;gap:12px}.mood{width:100%;border:3px solid rgba(255,255,255,.56);border-radius:20px;padding:16px;color:var(--ink);background:rgba(255,252,239,.68);text-align:left;cursor:pointer}.mood strong,.mood span{display:block}.mood span{margin-top:6px;color:var(--muted);line-height:1.5;font-weight:700}.mood.active{border-color:#ffe36d;background:rgba(255,248,199,.86);box-shadow:0 0 0 6px rgba(255,227,109,.24)}
    .mem{display:grid;gap:24px;margin:24px 0}.mem article{padding:18px;border-radius:22px;background:rgba(255,252,239,.72);box-shadow:0 8px 20px rgba(70,86,68,.1)}.mem img,.placeholder{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;border:7px solid rgba(255,255,255,.7)}.placeholder{display:grid;place-items:center;background:rgba(255,252,239,.62);color:var(--leaf-dark);font-weight:950}.share{display:grid;justify-items:center;align-content:center;width:min(100%,360px);aspect-ratio:9/16;margin:0 auto 20px;padding:28px;border:10px solid rgba(255,252,239,.8);border-radius:28px;background:radial-gradient(circle at 50% 38%,rgba(255,227,109,.74),transparent 21%),linear-gradient(180deg,#b8cdae,#dce4bd 64%,#f8df9c);text-align:center}.share h2,.share h3{color:#fff;text-shadow:0 4px 0 rgba(54,60,52,.42)}.reset{position:fixed;right:max(12px,calc((100vw - 480px)/2 + 12px));bottom:14px;z-index:20;min-height:42px;border:2px solid rgba(255,255,255,.72);border-radius:999px;padding:9px 13px;color:#fff;background:rgba(73,91,72,.76);box-shadow:0 7px 0 rgba(55,70,54,.24);font-weight:950}
  </style>
</head>
<body>
  <main id="app"></main>
  <button class="reset" onclick="resetAll()">↺ 清空缓存</button>
  <script>
    const key = "study-abroad-starter-village-ios";
    const tasks = [
      {id:1,day:1,icon:"✈️",title:"抵达新大陆",real:"成功落地目的地国家",desc:"你已经抵达机场。这是整个冒险的起点。",why:"先不用解决所有问题。今天最重要的一步，是确认自己真的到了。",prep:["护照和入境材料","行李","目的地地址"],done:"你到了。\n\n几个小时前，这里还只是地图上的一个名字。\n\n从现在开始，它会一点一点变成你的生活。",unlock:"新世界已开启",node:"机场灯塔点亮",hint:"机场、行李、航站楼、第一眼看到的城市。"},
      {id:2,day:1,icon:"🏠",title:"找到第一个据点",real:"从机场顺利抵达自己的住宿地点",desc:"抵达学生公寓、租住房屋、酒店、寄宿家庭或临时住所。",why:"当门关上、行李放下，你会拥有一个暂时属于自己的安全角落。",prep:["住宿地址","交通路线","房东或前台联系方式"],done:"门关上的那一刻，你终于拥有了一个暂时属于自己的地方。\n\n行李可以放下了。\n\n今天已经走了很远。",unlock:"据点已建立",node:"小屋亮起",hint:"门牌、窗外、房间角落或放下的行李。"},
      {id:3,day:2,icon:"📡",title:"重新连接世界",real:"办理当地手机卡 / SIM 卡 / eSIM",desc:"办理实体 SIM 或 eSIM，保存自己的本地手机号。",why:"有了本地号码，银行、学校、配送和朋友都更容易找到你。",prep:["确认手机是否支持当地网络","比较套餐价格和流量","留意是否存在合约期"],done:"信号重新亮起来了。\n\n从今天开始，你拥有了一个属于这里的电话号码。\n\n这座城市开始能够联系到你。",unlock:"通讯能力 +1",node:"信号塔点亮",hint:"SIM 卡包装、手机信号、营业厅。"},
      {id:4,day:3,icon:"🌙",title:"第一晚生存挑战",real:"在新的住所度过自己的第一个夜晚",desc:"今天的任务只有一个：好好度过来到这里之后的第一个夜晚。",why:"也许房间很陌生，也许你还没完全意识到自己已经来到了另一个国家。平安结束，就是胜利。",prep:["给重要的人报平安","确认门窗","给手机充电","简单整理明天要用的东西","喝水","休息"],done:"第一晚结束了。\n\n这可能只是一个普通的夜晚。\n\n但以后回头看的时候，你会知道：\n\n从这个晚上开始，你真的住在这里了。",unlock:"生存 Day +1",node:"月亮营地点亮",hint:"床头、窗外夜色、今晚陪着你的东西。"},
      {id:5,day:4,icon:"🏦",title:"建立金币账户",real:"办理当地银行卡 / 银行账户",desc:"准备材料，去了解并办理适合自己的当地银行账户。",why:"这不是金币系统本身，而是你进入当地支付和生活系统的一扇门。",prep:["护照","当地手机号","地址信息","学生证明","签证信息","具体材料以当地银行要求为准"],done:"账户建立完成。\n\n从今天开始，你已经拥有了属于这里的金融入口。\n\n生活系统又完整了一块。",unlock:"金币系统已开启",node:"银行 / 金库点亮",hint:"银行门口、排队号码、银行卡信封。"},
      {id:6,day:5,icon:"💳",title:"第一次本地交易",real:"使用当地银行卡完成第一次线下消费",desc:"金额不限。水、咖啡、食物、生活用品或公交票都可以。",why:"这只是一次很小的交易，但你开始真正参与这里的日常生活。",prep:["银行卡或移动支付","确认金额","保存小票或支付记录"],done:"支付成功。\n\n这只是一次很小的交易。\n\n但你已经开始真正参与这里的日常生活。",unlock:"交易能力 +1",node:"集市摊位点亮",hint:"小票、咖啡、买到的东西。"},
      {id:7,day:6,icon:"🛒",title:"第一次补给行动",real:"独立去一次当地超市",desc:"观察货架、价格、自助结账和购物袋规则。不要求必须购买。",why:"你会开始知道食物在哪里，生活用品在哪里，多少钱可以买到。",prep:["购物袋","支付方式","回家路线"],challenge:["一样自己认识的东西","一样以前没见过的东西","一样以后可能会经常买的东西"],done:"补给完成。\n\n你开始知道食物在哪里，生活用品在哪里，多少钱可以买到。\n\n一座城市开始从陌生地图变成可以生活的地方。",unlock:"补给站已开启",node:"补给站点亮",hint:"购物车、超市货架、食材。"},
      {id:8,day:7,icon:"🍜",title:"第一次城市用餐",real:"独立完成一次在当地餐厅 / 咖啡店 / 快餐店点餐",desc:"进入店铺，看菜单，完成点餐，支付，然后吃完这一顿饭。",why:"从机场走到今天，这座城市已经不再只是一个陌生的地方。",prep:["选择一家压力不大的店","看清菜单","准备支付方式"],challenge:["今天试着自己完成整次点餐"],done:"你完成了第一次属于自己的城市用餐。\n\n从机场走到今天，\n这座城市已经不再只是一个陌生的地方。",unlock:"新手村终章开启",node:"城市餐桌点亮",hint:"餐盘、饮料、菜单或坐下来的那一刻。"}
    ];
    const moods = {good:["🙂 还不错","看起来这座城市今天对你还算友好。"],tired:["😐 有点累","第一个星期本来就会消耗很多精力。今天已经结束了。"],hard:["🥲 今天有点难","有些日子只要平安结束，就已经完成了今天的任务。"]};
    function initial(started=false){return{started,current:1,completed:[],delayed:[],days:Array.from({length:7},(_,i)=>({day:i+1,photo:"",mood:""})),done:false}}
    function load(){try{return JSON.parse(localStorage.getItem(key))||initial()}catch{return initial()}}function save(s){localStorage.setItem(key,JSON.stringify(s))}
    let state=load();const app=document.getElementById("app");function cat(){return `<div class="cat"><div class="body"><div class="ear l"></div><div class="ear r"></div><div class="eye l"></div><div class="eye r"></div><div class="nose"></div><div class="belly"></div><div class="bag"></div></div><div class="case"></div></div>`}
    function shell(html,cls=""){app.innerHTML=`<section class="screen ${cls}"><div class="texture"></div><div class="frame">${html}</div></section>`;scrollTo(0,0)}
    function go(p){location.hash=p;render()}function status(id){if(state.completed.includes(id))return"completed";if(state.current===id)return state.delayed.includes(id)?"delayed":"available";return id<state.current?"completed":"locked"}
    function render(){state=load();const h=location.hash.slice(1)||"home";if(!state.started&&h!=="home")return go("home");if(h==="home")return opening();if(h==="journey")return journey();let [p,id]=h.split("/");if(p==="task")return task(+id);if(p==="complete")return complete(+id);if(p==="unfinished")return unfinished(+id);if(p==="photo")return photo(+id);if(p==="reflection")return reflection(+id);if(p==="final")return finalPage();if(p==="memories")return memories();journey()}
    function opening(){if(state.started)return go("journey");shell(`<div class="center">${cat()}<p class="eyebrow">WELCOME</p><h1 class="title">欢迎来到你的新生活。</h1><div class="story"><p>接下来的 7 天，我们会陪你完成一些看起来很小，但非常重要的事情。</p><p>不用一次搞定所有问题。</p><p>我们一天走一点。</p></div><button class="btn primary" onclick="state=initial(true);save(state);go('journey')">开始我的第一周</button></div>`)}
    function journey(){let done=state.completed.length,day=(tasks.find(t=>t.id===state.current)||tasks[7]).day;let nodeHtml=tasks.map(t=>{let s=status(t.id),locked=s==="locked";let label=s==="completed"?"已点亮":s==="delayed"?"等你回来":s==="available"?"CURRENT":"LOCKED";let click=locked?"":" onclick=\"go('task/"+t.id+"')\"";return "<article class=\"node "+s+"\""+click+"><div class=\"icon\">"+(locked?"☁️":t.icon)+"</div><div class=\"copy\"><p>DAY "+t.day+"</p><h2>"+(locked?"???":t.title)+"</h2><span>"+label+"</span></div></article>"}).join("");shell(`<section class="top"><p class="eyebrow">Study Abroad Starter Village</p><h1 class="title">留学新手村</h1><p class="sub">DAY ${day} / 7 · 你的第一周冒险</p><div class="bar"><span style="width:${done/8*100}%"></span></div><p class="progressText">${done} / 8 个节点完成</p></section><section class="map"><div class="clouds">☁️ ☁️ ☁️</div><div class="path"></div><div class="nodes">${nodeHtml}</div></section><div class="actions"><button class="btn secondary" onclick="go('memories')">回忆录</button>${state.done?`<button class="btn primary" onclick="go('final')">第一周完成</button>`:""}</div>`)}
    function task(id){let t=tasks.find(x=>x.id===id),s=status(id),can=s==="available"||s==="delayed";shell(`<button class="btn ghost" onclick="go('journey')">← 回到地图</button><p class="eyebrow">DAY ${t.day}</p><h1 class="title">${t.title}</h1><div class="art"><span>${t.icon}</span><i></i></div><section class="panel"><h2>今天的任务</h2><p class="big">${t.real}</p><p>${t.desc}</p></section><section class="panel"><h2>为什么要做这件事？</h2><p>${t.why}</p></section><section class="panel"><h2>准备这些</h2><ul class="list">${t.prep.map(x=>`<li>${x}</li>`).join("")}</ul></section>${t.challenge?`<section class="panel"><h2>今日探索</h2><ul class="list">${t.challenge.map(x=>`<li>${x}</li>`).join("")}</ul></section>`:""}${s==="completed"?`<p class="notice">这个节点已经点亮了。你可以回来看看当时完成了什么。</p>`:`<div class="actions"><button class="btn primary" ${can?'':'disabled'} onclick="finish(${id})">${id===4?'今晚安全结束':'我完成了'}</button><button class="btn secondary" ${can?'':'disabled'} onclick="delay(${id})">今天还没完成</button></div>`}`)}
    function finish(id){if(!state.completed.includes(id))state.completed.push(id);state.delayed=state.delayed.filter(x=>x!==id);let next=tasks.find(t=>t.id>id&&!state.completed.includes(t.id));state.current=next?next.id:id;state.done=state.completed.length>=8;save(state);go("complete/"+id)}
    function delay(id){if(!state.delayed.includes(id))state.delayed.push(id);save(state);go("unfinished/"+id)}
    function complete(id){let t=tasks.find(x=>x.id===id);shell(`<div class="center">${cat()}<p class="eyebrow">任务完成</p><h1 class="title">${t.title}</h1><p class="notice">${t.unlock}<br>${t.node}</p><blockquote class="quote">${t.done}</blockquote><button class="btn primary" onclick="go('photo/${t.day}')">留下今天的照片</button><button class="btn secondary" onclick="go('reflection/${t.day}')">今天先不留</button></div>`)}
    function unfinished(id){shell(`<div class="center"><div class="badge">🌙</div><h1 class="title">今天没有完成也没关系。</h1><div class="story"><p>刚到一个陌生国家的时候，事情经常不会按照计划发生。</p><p>也许银行关门了。也许手机卡没有办下来。也许今天只是有点累。</p><p>这个任务不会消失。它会在这里等你。</p></div><button class="btn primary" onclick="go('journey')">明天继续</button><button class="btn secondary" onclick="go('task/${id}')">返回任务</button></div>`)}
    function photo(day){let r=state.days[day-1];shell(`<div class="center"><div class="badge">📷</div><p class="eyebrow">DAY ${day}</p><h1 class="title">为今天留下一张照片</h1><div class="story"><p>不一定要拍得好看。</p><p>以后你可能会想看看，那天看到了什么。</p></div><div class="photo">${r.photo?`<img src="${r.photo}" alt="今日照片">`:`<label class="empty"><span>📷</span><input hidden type="file" accept="image/*" onchange="readPhoto(event,${day})">上传照片</label>`}</div><button class="btn secondary" onclick="document.querySelector('input[type=file]')?.click()">选择 / 更换照片</button><button class="btn primary" onclick="go('reflection/${day}')">继续</button><button class="btn ghost" onclick="go('reflection/${day}')">今天先不留</button></div>`)}
    function readPhoto(e,day){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{state.days[day-1].photo=reader.result;save(state);photo(day)};reader.readAsDataURL(f)}
    function reflection(day){let r=state.days[day-1];shell(`<div class="center"><p class="eyebrow">每日反馈</p><h1 class="title">今天过得怎么样？</h1><div class="moods">${Object.entries(moods).map(([k,v])=>`<button class="mood ${r.mood===k?'active':''}" onclick="state.days[${day-1}].mood='${k}';save(state);reflection(${day})"><strong>${v[0]}</strong><span>${v[1]}</span></button>`).join("")}</div>${r.mood?`<p class="notice">${moods[r.mood][1]}</p><button class="btn primary" onclick="go('${state.done?'final':'journey'}')">${state.done?'进入第一周终章':'回到地图'}</button>`:""}</div>`)}
    function finalPage(){let photos=state.days.filter(d=>d.photo).length;let firsts=["独自落地","找到住处","建立通讯","度过第一个夜晚","建立银行账户","完成本地消费","独自逛超市","独自在城市里吃饭"];shell(`<div class="center"><p class="eyebrow">DAY 7</p><h1 class="title">第一周完成</h1>${cat()}<p class="notice"><b>7 DAYS</b><br>8 个新生活节点<br>${photos} 张生活照片</p><section class="panel"><h2>第一次</h2><ul class="list">${firsts.map(x=>`<li>${x}</li>`).join("")}</ul></section><blockquote class="quote">七天前，\n这里还是一个完全陌生的地方。\n\n现在你已经知道：在哪里睡觉，怎样联系别人，怎样付款，去哪里买东西，怎样让自己吃上一顿饭。\n\n这些事情看起来都很小。\n但一座陌生城市，就是这样一点一点变成生活的。</blockquote><h2 class="title">新手村通关</h2><button class="btn primary" onclick="go('memories')">查看 7 日回忆录</button><button class="btn secondary" onclick="go('journey')">回到地图</button></div>`)}
    function memories(){shell(`<button class="btn ghost" onclick="go('journey')">← 回到地图</button><p class="eyebrow">7日回忆录</p><h1 class="title">《来到这里的第一个星期》</h1><section class="mem">${state.days.map(d=>{let ts=tasks.filter(t=>t.day===d.day),q=ts[ts.length-1].done.split("\\n")[0];return `<article><p class="eyebrow">DAY ${d.day}</p><h2>${ts.map(t=>t.title).join(" / ")}</h2>${d.photo?`<img src="${d.photo}" alt="DAY ${d.day}">`:`<div class="placeholder">那天没有留下照片</div>`}<blockquote>“${q}”</blockquote>${d.mood?`<p>${moods[d.mood][1]}</p>`:""}</article>`}).join("")}</section><div class="share"><p>MY FIRST WEEK ABROAD</p><h2>我的留学新手村</h2><h3>7 DAYS<br>8 MISSIONS</h3><p>✈️ 🏠 📱 🌙 🏦 💳 🛒 🍜</p><h3>新手村通关</h3><blockquote>“这里已经开始变成我的生活。”</blockquote><p style="font-size:34px">ᓚᘏᗢ</p></div>`)}
    function resetAll(){localStorage.removeItem(key);state=initial();location.hash="home";render()}window.addEventListener("hashchange",render);render();
  </script>
</body>
</html>
